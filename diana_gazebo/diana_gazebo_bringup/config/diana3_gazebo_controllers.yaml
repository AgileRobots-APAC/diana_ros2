/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      joint_position_example_controller:
        type: diana_example_controllers/JointPositionExampleController

      joint_velocity_example_controller:
        type: diana_example_controllers/JointVelocityExampleController

      joint_impedance_example_controller:
        type: diana_example_controllers/JointImpedanceExampleController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      
      gravity_compensation_example_controller:
        type: diana_example_controllers/GravityCompensationExampleController

      model_example_controller:
        type: diana_example_controllers/ModelExampleController

      cartesian_impedance_example_controller:
        type: diana_example_controllers/CartesianImpedanceExampleController

  joint_position_example_controller:
    ros__parameters:
      robot_type: "diana3"
      gazebo: true

  joint_velocity_example_controller:
    ros__parameters:
      robot_type: "diana3"
      gazebo: true

  joint_impedance_example_controller:
    ros__parameters:
      robot_type: "diana3"
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5

  model_example_controller:
    ros__parameters:
      robot_type: 'diana3'
      arm_prefix: ''
