# This is a namespace agnostic configuration file for the Diana series robot.
# That is to say, it is not tied to any specific namespace and can be used in
# any namespace.


/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98

      cartesian_elbow_example_controller:
        type: diana_example_controllers/CartesianElbowExampleController

      cartesian_orientation_example_controller:
        type: diana_example_controllers/CartesianOrientationExampleController

      cartesian_pose_elbow_example_controller:
        type: diana_example_controllers/CartesianElbowExampleController

      cartesian_pose_example_controller:
        type: diana_example_controllers/CartesianPoseExampleController

      cartesian_velocity_example_controller:
        type: diana_example_controllers/CartesianVelocityExampleController

      elbow_example_controller:
        type: diana_example_controllers/ElbowExampleController

      diana_robot_state_broadcaster:
        type: diana_robot_state_broadcaster/DianaRobotStateBroadcaster
        state_interfaces:
          robot_state

      gravity_compensation_example_controller:
        type: diana_example_controllers/GravityCompensationExampleController

      gripper_example_controller:
        type: diana_example_controllers/GripperExampleController

      joint_impedance_example_controller:
        type: diana_example_controllers/JointImpedanceExampleController

      joint_impedance_with_ik_example_controller:
        type: diana_example_controllers/JointImpedanceWithIKExampleController

      joint_position_example_controller:
        type: diana_example_controllers/JointPositionExampleController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      joint_velocity_example_controller:
        type: diana_example_controllers/JointVelocityExampleController

      model_example_controller:
        type: diana_example_controllers/ModelExampleController

      move_to_start_example_controller:
        type: diana_example_controllers/MoveToStartExampleController


/**:
  joint_impedance_example_controller:
    ros__parameters:  
      k_gains:
        - 50.0
        - 50.0
        - 50.0
        - 50.0
        - 20.0
        - 10.0
        - 5.0
      d_gains:
        - 4.0
        - 4.0
        - 4.0
        - 2.0
        - 2.0
        - 2.0
        - 1.0

/**:
  diana_robot_state_broadcaster:
    ros__parameters:
      # Publish rate in Hz for convenience topics (current_pose, joint_states, wrenches, etc.).
      # Full robot state always publishes at the controller update rate (1kHz).
      convenience_publish_rate: 1000

/**:
  joint_impedance_with_ik_example_controller:
    ros__parameters:
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 10.0
        - 10.0
        - 5.0

/**:
  move_to_start_example_controller:
    ros__parameters:
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 20.0
        - 10.0
        - 10.0
        - 5.0
