/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      diana7_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      diana_robot_state_broadcaster:
        type: diana_robot_state_broadcaster/DianaRobotStateBroadcaster
        robot_type: "diana7"

/**:
  diana7_arm_controller:
    ros__parameters:
      # Fake mode uses mock_components/GenericSystem, which mirrors the written
      # command into the matching state interface. Position commands therefore
      # make the simulated arm move; effort commands would not (no dynamics).
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      joints:
        - diana7_joint1
        - diana7_joint2
        - diana7_joint3
        - diana7_joint4
        - diana7_joint5
        - diana7_joint6
        - diana7_joint7
