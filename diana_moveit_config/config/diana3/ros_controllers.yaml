/**: 
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      diana3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      diana_robot_state_broadcaster:
        type: diana_robot_state_broadcaster/DianaRobotStateBroadcaster
        robot_type: "diana3"

/**: 
  diana3_arm_controller:
    ros__parameters:
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      joints:
        - diana3_joint1
        - diana3_joint2
        - diana3_joint3
        - diana3_joint4
        - diana3_joint5
        - diana3_joint6
        - diana3_joint7
      gains:
        diana3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
        diana3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
        diana3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
        diana3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
        diana3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
        diana3_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
        diana3_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }
